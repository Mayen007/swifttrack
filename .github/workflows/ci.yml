name: SwiftTrack Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    name: Build, Verify & Test Logistics Platform
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swifttrack_admin
          POSTGRES_PASSWORD: super_secure_pg_password_2026
          POSTGRES_DB: swifttrack_logistics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_CLIENT: postgres
      DATABASE_URL: postgres://swifttrack_admin:super_secure_pg_password_2026@localhost:5432/swifttrack_logistics
      PORT: 4000
      JWT_SECRET: test_jwt_secret_key_swifttrack_ci_2026_enterprise
      REFRESH_TOKEN_SECRET: test_refresh_token_secret_ci_2026_enterprise

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Build Frontend Application
        run: cd client && npm run build

      - name: Run Authoritative PostgreSQL Migrations
        run: npm run db:migrate

      - name: Bootstrap PostgreSQL Production Baseline & Demo Seed
        run: npm run db:seed:prod

      - name: Verify PostgreSQL Migrations & Repository Layer
        run: node tests/database/test-postgres-data-architecture.js

      - name: Run Core System Verification Suite
        run: node tests/verify-system.js

      - name: Verify API Documentation Parity
        run: node tests/docs/test-api-doc-parity.js

      - name: Run Logistics Domain Test Suites
        run: |
          node tests/logistics/test-shipments-core.js
          node tests/logistics/test-transport-runs.js
          node tests/logistics/test-physical-custody.js
          node tests/logistics/test-last-mile-delivery.js
          node tests/logistics/test-cod-settlement.js
          node tests/logistics/test-control-tower.js
          node tests/logistics/test-notifications-engine.js
          node tests/logistics/test-multi-leg-and-customs.js
          node tests/logistics/test-offline-sync.js
          node tests/logistics/test-vehicles-management.js
          node tests/logistics/test-drivers-management.js

      - name: Run Full End-to-End Acceptance Scenario (PRD Section 30)
        run: node tests/logistics/test-e2e-acceptance.js

      - name: Verify Security & Injection Guards
        run: |
          node tests/security/test-sql-injection.js
          node tests/security/test-csrf-cors.js
          node tests/security/test-xss.js
