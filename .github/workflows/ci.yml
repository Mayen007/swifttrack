name: SwiftTrack Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    name: Build, Verify & Test Logistics Platform
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: swifttrack_admin
          POSTGRES_PASSWORD: super_secure_pg_password_2026
          POSTGRES_DB: swifttrack_logistics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_CLIENT: postgres
      DATABASE_URL: postgres://swifttrack_admin:super_secure_pg_password_2026@localhost:5432/swifttrack_logistics
      PORT: 4000
      JWT_SECRET: test_jwt_secret_key_swifttrack_ci_2026_enterprise
      REFRESH_TOKEN_SECRET: test_refresh_token_secret_ci_2026_enterprise

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Static Architecture & Security Governance Gates
        run: |
          npm run lint:architecture
          npm run audit:secrets

      - name: Build Frontend Application
        run: cd client && npm run build

      - name: Verify Frontend Component & Navigation Integrity
        run: npm run test:frontend

      - name: Run Authoritative PostgreSQL Migrations
        run: npm run db:migrate

      - name: Verify PostgreSQL Migrations & Repository Layer
        run: node tests/database/test-postgres-data-architecture.js

      - name: Run Core System Verification Suite
        run: node tests/verify-system.js

      - name: Verify API Documentation Parity
        run: node tests/docs/test-api-doc-parity.js

      - name: Run Inventory & Warehousing Domain Suites
        run: npm run test:inventory

      - name: Run Point of Sale & Counter Booking Suites
        run: npm run test:pos

      - name: Run Orders State Machine & Allocation Suites
        run: npm run test:orders

      - name: Run Commerce, Pricing & Customer Domain Suites
        run: |
          npm run test:commerce
          npm run test:customers

      - name: Run Procurement & Vendor Lifecycle Suites
        run: npm run test:procurement

      - name: Run Financial Reporting & Payment Ledger Suites
        run: |
          npm run test:reports
          npm run test:payments

      - name: Run Logistics, Transport & Fleet Suites
        run: |
          npm run test:fleet
          npm run test:logistics

      - name: Verify Live Gateways & Regional Customs Manifest
        run: npm run test:gateways

      - name: Verify Disaster Recovery & Observability Metrics (Track 6)
        run: |
          npm run test:backup
          npm run test:metrics

      - name: Verify Security & Injection Guards
        run: npm run test:security

      - name: Run Full End-to-End Acceptance Scenario (PRD Section 30)
        run: npm run test:e2e
